name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Point these at your live deployed URLs once frontend + backend are hosted.
      SITE_URL: ${{ vars.SITE_URL || 'https://a-reinking.github.io/qa_pf/'}}
      API_URL: ${{ vars.API_URL || 'https://qa-pf.onrender.com/'}}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify deployed site
        shell: bash
        run: |
          set -euo pipefail

          SITE="${SITE_URL%/}"
          curl --fail --silent --show-error --location "$SITE/" > /tmp/site.html
          grep -Fq 'Andy Reinking' /tmp/site.html
          grep -Fq 'id="contact-form"' /tmp/site.html

          curl --fail --silent --show-error --location "$SITE/script.js" \
            > /tmp/script.js
          grep -Fq '.replace(/\/+$/, "")' /tmp/script.js

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Commits the report directly into this same branch/checkout, under
      # /test-report, so GitHub Pages (already serving main) picks it up.
      # We use plain git here instead of peaceiris/actions-gh-pages because
      # that action explicitly refuses to deploy when the source and
      # destination branch are the same (a safety guard with no override).
      # [skip ci] in the commit message stops this bot commit from
      # re-triggering the workflow in a loop.
      - name: Publish report into main under /test-report
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p test-report
          rm -rf test-report/*
          cp -r playwright-report/* test-report/
          git add test-report
          if git diff --cached --quiet; then
            echo "No changes to the report; nothing to commit."
          else
            git commit -m "chore: publish latest Playwright report [skip ci]"
            git push
          fi
