name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Point these at your live deployed URLs once frontend + backend are hosted.
      SITE_URL: ${{ vars.SITE_URL || 'https://areinking1979.github.io/qa_pf/'}}
      API_URL: ${{ vars.API_URL || 'https://qa-pf.onrender.com/'}}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify deployed site
        shell: bash
        run: |
          set -euo pipefail

          SITE="${SITE_URL%/}"
          curl --fail --silent --show-error --location "$SITE/" > /tmp/site.html
          grep -Fq 'Andy Reinking' /tmp/site.html
          grep -Fq 'id="contact-form"' /tmp/site.html

          curl --fail --silent --show-error --location "$SITE/script.js" \
            > /tmp/script.js
          grep -Fq '.replace(/\/+$/, "")' /tmp/script.js

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Publishes the report into the SAME branch/folder structure GitHub Pages
      # already serves (main, root), under /test-report — rather than a separate
      # gh-pages branch, which Pages isn't configured to serve here and would
      # 404. keep_files: true stops this from wiping out index.html etc.
      # [skip ci] in the commit message stops this bot commit from re-triggering
      # the workflow in a loop.
      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main' && success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./playwright-report
          destination_dir: test-report
          keep_files: true
          commit_message: "chore: publish latest Playwright report [skip ci]"
